<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حسام</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: Tahoma, sans-serif;
      color: #fff;
    }
    h1 { margin-bottom: 4px; }
    p { margin-top: 0; color: #aaa; }
    a.btn {
      display: block;
      width: 260px;
      padding: 20px;
      margin: 8px 0;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    a.btn:hover {
    img.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #0f3460;
  margin-bottom: 12px;
}
      background: #0f3460;
    }
  </style>
</head>
<body>
  <img class="avatar" src="gaming_logo_under_1mb.jpg" alt="حسام">
  <h1>HesamAbner|حسام ابنر</h1>
  <p>:لینک‌های من</p>

  <a class="btn rubika" href="https://web.rubika.ir/#c=c0Dwp270859196590239bc887e8cf547">روبیکا</a>
  <a class="btn kick" href="https://kick.com/HesamAbner_KICK">کیک</a>
  <a class="btn github" href="https://github.com/HesamAbner">گیت هاب</a>
  <a class="btn aparat" href="https://www.aparat.com/Hesamabner">آپارات</a>
  <a class="btn twitch" href="https://www.twitch.tv/HesamAbner_TWITCH">توییچ</a>
  <a class="btn donate" href="https://reymit.ir/hesamabner">حمایت (دونیت)</a>

  <script>
    document.querySelectorAll('a.btn').forEach(function (btn) {
      btn.addEventListener('mousemove', function (e) {
        var r = btn.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5;
        var y = (e.clientY - r.top) / r.height - 0.5;
        btn.style.transform =
          'perspective(500px) rotateX(' + (-y * 30) + 'deg) rotateY(' + (x * 30) + 'deg) scale(1.05)';
      });
      btn.addEventListener('mouseleave', function () {
        btn.style.transform = '';
      });
    });
  </script>
</body>
</html>
